# Единственная палитра системы — «Fav».
#
# Раньше цвета ехали вместе с обоями: каждая тема несла свои accent/bg/fg, и
# смена картинки перекрашивала терминалы, waybar, btop и редакторы. Теперь
# палитра одна и живёт здесь, а темы меняют только обои.
#
# Правится руками; чтобы разложить цвета по приложениям, нужно один раз
# запустить ~/.config/hypr/scripts/palette.sh.

$accent_color = #8B284C
$bg_color = #230f1b
$fg_color = #c8c3c6

# Фон терминалов может быть темнее общего: если строки нет, берётся $bg_color.
$term_bg = #230f1b
